server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: fraud-detection-service

  datasource:
    url: jdbc:postgresql://localhost:5432/fraud_db
    username: fraud_user
    password: fraud_pass
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
    consumer:
      group-id: fraud-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.fraud.*"

# ML Python service
ml:
  service:
    base-url: http://localhost:8000
    timeout-ms: 20000

# JWT
jwt:
  secret: "your-256-bit-secret-change-in-production-must-be-very-long"
  expiration-ms: 86400000       # 24 hours

# Fraud decision thresholds
fraud:
  threshold:
    block: 0.72
    review: 0.40
  kafka:
    topic:
      transactions-raw: transactions.raw
      fraud-scored: fraud.scored
      drift-signals: drift.signals.retraining

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    com.fraud: DEBUG
    org.springframework.security: INFO
    org.springframework.kafka: WARN
